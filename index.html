<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            }
          });
        } catch (err) {
          console.warn('Polyfilled fetch property setup', err);
        }

        // Suppress external extension errors (e.g. chrome-extension:// interceptors)
        window.addEventListener('error', function(event) {
          if (
            (event.filename && event.filename.indexOf('chrome-extension://') !== -1) ||
            (event.message && event.message.indexOf('Cannot set property fetch') !== -1) ||
            (event.error && event.error.stack && event.error.stack.indexOf('chrome-extension://') !== -1)
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          if (
            reason &&
            (
              (typeof reason === 'string' && (reason.indexOf('chrome-extension://') !== -1 || reason.indexOf('Cannot set property fetch') !== -1)) ||
              (reason.message && (reason.message.indexOf('chrome-extension://') !== -1 || reason.message.indexOf('Cannot set property fetch') !== -1)) ||
              (reason.stack && (reason.stack.indexOf('chrome-extension://') !== -1 || reason.stack.indexOf('Cannot set property fetch') !== -1))
            )
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
      })();
    </script>
    <title>PetCare AI & Hub - Comprehensive Pet Care & AI Veterinary Platform</title>

    <meta property="og:description" content="Comprehensive Pet Care and AI Veterinary platform with multimodal symptom checker, pet encyclopedia, dietary and toxicity guides, equipment shop, and pet health tools." />
